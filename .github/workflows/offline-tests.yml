name: offline tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run offline test suite
        shell: pwsh
        run: |
          .\tests\Run-Tests.ps1
          exit $LASTEXITCODE
